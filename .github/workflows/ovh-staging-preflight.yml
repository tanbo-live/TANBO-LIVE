name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  staging-https:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Configure isolated staging HTTPS
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' srs)" = true
          test "$(docker inspect -f '{{.State.Running}}' srs-staging)" = true
          getent ahostsv4 staging-live.tanbo.co.uk | grep -q '51.89.224.80' || { echo 'DNS not propagated yet'; exit 2; }
          cp -a /etc/nginx /etc/nginx.tanbo-pre-staging-$(date +%Y%m%d%H%M%S)
          cat >/etc/nginx/sites-available/tanbo-staging-live <<'NGINX'
          server {
              listen 80;
              server_name staging-live.tanbo.co.uk;
              location / {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/tanbo-staging-live /etc/nginx/sites-enabled/tanbo-staging-live
          nginx -t
          systemctl reload nginx
          if command -v certbot >/dev/null 2>&1; then
            certbot --nginx -d staging-live.tanbo.co.uk --non-interactive --agree-tos --redirect --keep-until-expiring
          else
            echo 'certbot unavailable'; exit 3
          fi
          nginx -t
          systemctl reload nginx
          curl -fsS --max-time 10 https://staging-live.tanbo.co.uk/ >/dev/null
          echo 'staging HTTPS healthy'
          echo "production_srs=$(docker inspect -f '{{.State.Running}}' srs)"
          echo "staging_srs=$(docker inspect -f '{{.State.Running}}' srs-staging)"
          REMOTE
