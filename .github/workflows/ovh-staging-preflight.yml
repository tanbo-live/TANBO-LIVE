name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  staging-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Install and verify isolated staging relay
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' srs)" = true
          test "$(docker inspect -f '{{.State.Running}}' srs-staging)" = true
          test -s /etc/tanbo-staging-relay/signing-key
          test -f /opt/tanbo-staging-relay/relay.py
          python3 -m py_compile /opt/tanbo-staging-relay/relay.py
          install -d -m 700 /etc/tanbo-staging-relay
          {
            printf 'TANBO_SRS_HOOK_SIGNING_KEY='
            cat /etc/tanbo-staging-relay/signing-key
            printf '\nTANBO_STAGING_API_ORIGIN=https://tanbo-staging.replit.app\n'
          } > /etc/tanbo-staging-relay/relay.env
          chmod 600 /etc/tanbo-staging-relay/relay.env
          cat > /etc/systemd/system/tanbo-staging-relay.service <<'UNIT'
          [Unit]
          Description=TANBO staging SRS trusted hook relay
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          EnvironmentFile=/etc/tanbo-staging-relay/relay.env
          ExecStart=/usr/bin/python3 /opt/tanbo-staging-relay/relay.py
          Restart=on-failure
          RestartSec=2
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now tanbo-staging-relay.service
          sleep 2
          systemctl is-active --quiet tanbo-staging-relay.service
          ss -ltn | grep -q '127.0.0.1:19090'
          test -z "$(ss -ltn | grep ':19090' | grep -v '127.0.0.1:19090' || true)"
          echo "relay_active=true"
          echo "relay_loopback_only=true"
          echo "production_srs=$(docker inspect -f '{{.State.Running}}' srs)"
          echo "staging_srs=$(docker inspect -f '{{.State.Running}}' srs-staging)"
          REMOTE
