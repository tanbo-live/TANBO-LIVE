name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  staging-auth-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Verify staging hooks and unauthorized WHIP fail closed
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' srs)" = true
          test "$(docker inspect -f '{{.State.Running}}' srs-staging)" = true
          systemctl is-active --quiet tanbo-staging-relay.service
          code=$(curl -sS -o /tmp/tanbo-hook-test.out -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"on_publish","vhost":"staging.tanbo.internal","app":"live","stream":"unauthorized-staging-probe","client_id":"probe"}' http://127.0.0.1:19090/on-publish || true)
          echo "unauthorized_callback_http=$code"
          test "$code" = "403"
          grep -q 'http_hooks' /opt/srs-staging/tanbo-staging.conf
          ss -ltn | grep -q '127.0.0.1:19090'
          test -z "$(ss -ltn | grep ':19090' | grep -v '127.0.0.1:19090' || true)"

          # Discover staging WHIP listener/route from installed config without changing it.
          echo "checking_unauthorized_whip=true"
          docker exec srs-staging sh -lc 'grep -nE "rtc_server|http_server|listen|candidate|whip|rtc" /usr/local/srs/conf/tanbo-staging.conf 2>/dev/null || true' || true
          # SRS WHIP is served over its HTTP API/server path. Probe the loopback-only staging HTTP listener.
          whip_code=$(curl -sS --max-time 8 -o /tmp/tanbo-whip-test.out -w '%{http_code}' \
            -X POST -H 'Content-Type: application/sdp' \
            --data-binary $'v=0\r\no=- 0 0 IN IP4 127.0.0.1\r\ns=unauthorized\r\nt=0 0\r\na=group:BUNDLE 0\r\nm=video 9 UDP/TLS/RTP/SAVPF 96\r\nc=IN IP4 0.0.0.0\r\na=mid:0\r\na=sendonly\r\na=rtcp-mux\r\na=rtpmap:96 H264/90000\r\n' \
            'http://127.0.0.1:1986/rtc/v1/whip/?app=live&stream=unauthorized-staging-probe&vhost=staging.tanbo.internal' || true)
          echo "unauthorized_whip_http=$whip_code"
          test "$whip_code" = "403"

          echo "unauthorized_publish_rejected=true"
          echo "unauthorized_whip_rejected=true"
          echo "relay_loopback_only=true"
          echo "production_srs=$(docker inspect -f '{{.State.Running}}' srs)"
          echo "staging_srs=$(docker inspect -f '{{.State.Running}}' srs-staging)"
          REMOTE
