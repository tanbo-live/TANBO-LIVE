name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  prepare-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Prepare isolated staging SRS
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' srs)" = "true"
          mkdir -p /opt/srs-staging
          cat >/opt/srs-staging/tanbo-staging.conf <<'CONF'
          listen 1935;
          max_connections 1000;
          srs_log_tank console;
          daemon off;
          http_api {
              enabled on;
              listen 1985;
          }
          http_server {
              enabled on;
              listen 8080;
              dir ./objs/nginx/html;
          }
          vhost staging.tanbo.internal {
              hls {
                  enabled on;
              }
              http_remux {
                  enabled on;
                  mount [vhost]/[app]/[stream].flv;
              }
          }
          CONF
          docker rm -f srs-staging >/dev/null 2>&1 || true
          docker run -d --name srs-staging --restart unless-stopped \
            -p 127.0.0.1:1936:1935/tcp \
            -p 127.0.0.1:1986:1985/tcp \
            -p 127.0.0.1:8081:8080/tcp \
            -v /opt/srs-staging/tanbo-staging.conf:/usr/local/srs/conf/tanbo-staging.conf:ro \
            ossrs/srs:6 ./objs/srs -c conf/tanbo-staging.conf
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' srs-staging)" = "true"
          curl -fsS http://127.0.0.1:1986/api/v1/versions
          echo
          echo "=== STAGING BINDINGS ==="
          docker port srs-staging
          echo "=== PRODUCTION STILL RUNNING ==="
          docker inspect -f '{{.State.Running}}' srs
          echo "=== STAGING CONFIG ==="
          grep -nE 'listen|vhost|http_api|http_server|http_hooks|on_publish|on_unpublish' /opt/srs-staging/tanbo-staging.conf
          REMOTE
