name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  inspect-staging-publish-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect staging SRS hook behavior without changes
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' srs)" = true
          test "$(docker inspect -f '{{.State.Running}}' srs-staging)" = true
          systemctl is-active --quiet tanbo-staging-relay.service
          echo "--- staging hook config ---"
          docker exec srs-staging sh -c "grep -n -A12 -B4 -E 'http_hooks|on_publish|on_unpublish' /usr/local/srs/conf/tanbo-staging.conf || true"
          echo "--- relay service recent log ---"
          journalctl -u tanbo-staging-relay.service --since "15 minutes ago" --no-pager | tail -120 || true
          echo "--- staging SRS recent hook/WHIP log ---"
          docker logs --since 15m srs-staging 2>&1 | grep -E 'on_publish|on_unpublish|http_hooks|whip|19090|unauthorized' | tail -160 || true
          echo "--- listeners ---"
          ss -ltnp | grep -E '19090|1986|8081|1936' || true
          echo "--- container gateway ---"
          docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}} {{.IPAddress}}{{end}}' srs-staging
          test "$(docker inspect -f '{{.State.Running}}' srs)" = true
          echo "production_srs_running=true"
          echo "inspection_complete=true"
          REMOTE
