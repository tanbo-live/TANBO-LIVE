name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  staging-rtc-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect staging RTC prerequisites without changes
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          echo "production_srs=$(docker inspect -f '{{.State.Running}}' srs)"
          echo "staging_srs=$(docker inspect -f '{{.State.Running}}' srs-staging)"
          echo "relay=$(systemctl is-active tanbo-staging-relay.service || true)"
          echo "--- staging config ---"
          sed -n '1,220p' /opt/srs-staging/tanbo-staging.conf
          echo "--- staging container mounts/ports/env names ---"
          docker inspect srs-staging --format 'Image={{.Config.Image}} Restart={{.HostConfig.RestartPolicy.Name}}'
          docker inspect srs-staging --format '{{range .Mounts}}Mount {{.Source}} -> {{.Destination}} rw={{.RW}}{{println}}{{end}}'
          docker inspect srs-staging --format '{{range $p,$v := .NetworkSettings.Ports}}Port {{$p}} -> {{range $v}}{{.HostIp}}:{{.HostPort}} {{end}}{{println}}{{end}}'
          docker inspect srs-staging --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -E 's/=.*$/=<redacted>/' || true
          echo "--- listeners relevant to staging/rtc ---"
          ss -lntup | grep -E ':(1936|1986|8081|8000|8001|19090)\b' || true
          echo "--- firewall status ---"
          ufw status numbered || true
          echo "--- nginx staging references ---"
          grep -R -n -E 'staging-live|1936|1986|8081|8001' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          echo "inspection_complete=true"
          REMOTE
