name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  inspect-staging-relay-network:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect relay and Docker bridge without changes
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          echo "--- relay service ---"
          systemctl cat tanbo-staging-relay.service
          echo "--- relay source bind lines ---"
          grep -nE '19090|HTTPServer|ThreadingHTTPServer|bind|listen' /opt/tanbo-staging-relay/relay.py || true
          echo "--- docker bridge ---"
          docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'
          echo "--- staging network ---"
          docker inspect srs-staging --format '{{range .NetworkSettings.Networks}}{{.Gateway}} {{.IPAddress}}{{end}}'
          echo "--- listeners ---"
          ss -ltn | grep ':19090' || true
          echo "production_srs=$(docker inspect -f '{{.State.Running}}' srs)"
          echo "staging_srs=$(docker inspect -f '{{.State.Running}}' srs-staging)"
          echo "inspection_complete=true"
          REMOTE
