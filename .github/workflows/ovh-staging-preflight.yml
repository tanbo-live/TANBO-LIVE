name: OVH Staging Preflight
on:
  workflow_dispatch:
jobs:
  staging-auth-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Verify staging hooks fail closed
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' srs)" = true
          test "$(docker inspect -f '{{.State.Running}}' srs-staging)" = true
          systemctl is-active --quiet tanbo-staging-relay.service
          code=$(curl -sS -o /tmp/tanbo-hook-test.out -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"on_publish","vhost":"staging.tanbo.internal","app":"live","stream":"unauthorized-staging-probe","client_id":"probe"}' http://127.0.0.1:19090/on-publish || true)
          echo "unauthorized_callback_http=$code"
          test "$code" = "403"
          grep -q 'http_hooks' /opt/srs-staging/tanbo-staging.conf
          ss -ltn | grep -q '127.0.0.1:19090'
          test -z "$(ss -ltn | grep ':19090' | grep -v '127.0.0.1:19090' || true)"
          echo "unauthorized_publish_rejected=true"
          echo "relay_loopback_only=true"
          echo "production_srs=$(docker inspect -f '{{.State.Running}}' srs)"
          echo "staging_srs=$(docker inspect -f '{{.State.Running}}' srs-staging)"
          REMOTE
