name: OVH Staging Preflight
run-name: OVH Staging Preflight — ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ovh-staging-preflight.yml"

permissions:
  contents: read

jobs:
  staging-diagnostics:
    name: Read-only staging diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect staging relay and SRS without changing anything
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set +e
          echo "=== containers ==="
          docker inspect -f 'production_srs_running={{.State.Running}}' srs 2>&1
          docker inspect -f 'staging_srs_running={{.State.Running}}' srs-staging 2>&1
          gateway="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' srs-staging 2>/dev/null)"
          echo "staging_gateway=$gateway"

          echo "=== relay/listener/hooks ==="
          systemctl is-active tanbo-staging-relay.service 2>&1
          ss -ltnp | grep ':19090' || true
          grep -n -A8 -B2 'http_hooks' /opt/srs-staging/tanbo-staging.conf 2>/dev/null || true

          echo "=== relay tcp ==="
          timeout 5 bash -c "</dev/tcp/$gateway/19090" && echo "relay_tcp_reachable=true" || echo "relay_tcp_reachable=false"

          echo "=== controlled on_publish probe ==="
          probe='{"action":"on_publish","client_id":"tanbo-diagnostic","ip":"127.0.0.1","vhost":"staging.tanbo.internal","app":"live","stream":"unauthorized-diagnostic","param":""}'
          probe_code="$(curl -sS --max-time 15 -o /tmp/tanbo-probe-body -w '%{http_code}' -H 'Content-Type: application/json' --data-binary "$probe" "http://$gateway:19090/on-publish")"
          echo "relay_probe_http=$probe_code"
          echo -n "relay_probe_body="
          head -c 300 /tmp/tanbo-probe-body 2>/dev/null | tr '\n\r' '  ' || true
          echo

          echo "=== actual unauthorized WHIP through staging SRS ==="
          before_srs="$(docker logs srs-staging 2>&1 | wc -l)"
          whip_stream="unauthorized-whip-diagnostic"
          sdp_file=/tmp/tanbo-diagnostic.sdp
          printf '%s\\r\\n' \
            'v=0' \
            'o=- 0 0 IN IP4 127.0.0.1' \
            's=-' \
            't=0 0' \
            'a=group:BUNDLE 0' \
            'm=audio 9 UDP/TLS/RTP/SAVPF 111' \
            'c=IN IP4 0.0.0.0' \
            'a=mid:0' \
            'a=sendonly' \
            'a=rtcp-mux' \
            'a=ice-ufrag:test' \
            'a=ice-pwd:testtesttesttesttesttest' \
            'a=fingerprint:sha-256 00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00' \
            'a=setup:actpass' \
            'a=rtpmap:111 opus/48000/2' > "$sdp_file"
          whip_code="$(curl -sS --max-time 12 -o /tmp/tanbo-whip-body -w '%{http_code}' -H 'Content-Type: application/sdp' --data-binary @"$sdp_file" "http://127.0.0.1:1986/rtc/v1/whip/?app=live&stream=$whip_stream&vhost=staging.tanbo.internal")"
          whip_rc=$?
          sleep 2
          echo "whip_curl_exit=$whip_rc"
          echo "whip_http=$whip_code"
          echo -n "whip_body="
          head -c 300 /tmp/tanbo-whip-body 2>/dev/null | tr '\n\r' '  ' || true
          echo
          echo "=== SRS lines produced by WHIP probe ==="
          docker logs srs-staging 2>&1 | tail -n +$((before_srs + 1)) | grep -E "$whip_stream|on_publish|http_hooks|hook|failed|WHIP|whip|disconnect|close" || true

          echo "=== recent relay journal ==="
          journalctl -u tanbo-staging-relay.service -n 80 --no-pager 2>&1 || true

          if [ "$whip_code" = "200" ] || [ "$whip_code" = "201" ]; then
            echo "unauthorized_whip_accepted=true"
          else
            echo "unauthorized_whip_accepted=false"
          fi

          if ss -ltn | grep -Eq '(^|[[:space:]])(0\.0\.0\.0|\[::\]):19090'; then
            echo "relay_public_listener=true"
          else
            echo "relay_public_listener=false"
          fi
          echo "diagnostics_complete=true"
          REMOTE
