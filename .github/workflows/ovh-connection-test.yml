name: OVH Live Pipeline Verify
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Verify live pipeline and publish protection read only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          echo STREAM_API
          curl -sS http://127.0.0.1:1985/api/v1/streams/ || true
          echo
          echo HLS_STATUS
          curl -sS -o /tmp/tanbo-hls -w '%{http_code}\n' http://127.0.0.1:8080/live/tanbo-test.m3u8 || true
          echo HLS_BODY
          head -20 /tmp/tanbo-hls 2>/dev/null || true
          echo SRS_PUBLISH_PROTECTION
          if [ -r /opt/srs/tanbo.conf ]; then
            grep -nE 'vhost|http_hooks|on_publish|on_unpublish|listen|rtc_server|http_api|http_server' /opt/srs/tanbo.conf || true
          else
            echo 'SRS config not readable'
          fi
          echo LISTENING_PORTS
          ss -lntup 2>/dev/null | grep -E ':(1935|1985|8080|8000)[[:space:]]' || true
          echo FIREWALL_STATUS
          ufw status 2>/dev/null || true
          echo NGINX_PROXY_ROUTES
          nginx -T 2>/dev/null | grep -E 'location |proxy_pass|listen ' | head -120 || true
          echo SRS_LOG_TAIL
          docker logs --tail 80 srs 2>&1 || true
          REMOTE
