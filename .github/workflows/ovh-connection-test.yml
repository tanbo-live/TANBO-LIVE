name: OVH Connection Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Fix and test HLS routing
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -e
          CONF=/etc/nginx/sites-available/default
          cp "$CONF" "$CONF.bak"
          if ! grep -q 'location ^~ /live/' "$CONF"; then
            sed -i '/^[[:space:]]*location \/ {/i\    location ^~ /live/ {\n        proxy_pass http://127.0.0.1:8080;\n        proxy_http_version 1.1;\n        add_header Cache-Control "no-cache" always;\n        add_header Access-Control-Allow-Origin "*" always;\n    }\n' "$CONF"
          fi
          nginx -t
          systemctl reload nginx
          echo "=== DIRECT SRS HLS ==="
          curl -sS -D /tmp/direct.headers -o /tmp/direct.body http://127.0.0.1:8080/live/tanbo-test.m3u8 || true
          head -20 /tmp/direct.headers
          head -10 /tmp/direct.body
          echo "=== PUBLIC HLS ==="
          curl -skS -D /tmp/public.headers -o /tmp/public.body https://live.tanbo.co.uk/live/tanbo-test.m3u8 || true
          head -20 /tmp/public.headers
          head -10 /tmp/public.body
          REMOTE
