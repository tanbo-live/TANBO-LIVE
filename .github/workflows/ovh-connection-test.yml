name: OVH SRS Config Inspect
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect effective SRS config only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          echo SRS_COMMAND
          docker inspect srs --format 'Cmd={{json .Config.Cmd}} Image={{.Config.Image}}'
          echo RTC_CONF
          docker exec srs cat conf/rtc.conf
          echo STREAM_API
          curl -sS http://127.0.0.1:1985/api/v1/streams/
          echo
          echo HLS_STATUS
          curl -sS -o /tmp/hls -w '%{http_code}\n' http://127.0.0.1:8080/live/tanbo-test.m3u8
          REMOTE
