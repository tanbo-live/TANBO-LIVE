name: OVH Nginx CORS Inspect
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Locate nginx config read only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -e
          nginx -T 2>&1 | grep -n -B4 -A14 'server_name live.tanbo.co.uk' || true
          echo CORS_LINES
          nginx -T 2>&1 | grep -n 'Access-Control-Allow-Origin' || true
          echo CONFIG_FILES
          grep -RIl 'server_name live.tanbo.co.uk' /etc/nginx 2>/dev/null || true
          REMOTE
