name: OVH Connection Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ovh-connection-test.yml']
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Locate broadcast app
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" '
            set +e
            echo "=== NGINX ROOTS/PROXIES ==="
            sudo nginx -T 2>/dev/null | grep -nE "server_name|root |alias |proxy_pass|location "
            echo "=== WEB DIRECTORIES ==="
            sudo find /var/www /opt /srv /home/ubuntu -maxdepth 4 -type f 2>/dev/null | head -300
            echo "=== WHIP REFERENCES ==="
            sudo grep -RniE "rtc/v1/whip|WHIP|Failed to fetch|Retry Preflight|Broadcast Error" /var/www /opt /srv /home/ubuntu 2>/dev/null | head -200
            echo "=== CONTAINERS ==="
            sudo docker ps --format "{{.Names}}|{{.Image}}|{{.Ports}}"
          '
