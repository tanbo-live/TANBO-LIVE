name: OVH SRS Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts
      - name: Repair SRS public WebRTC candidate
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$OVH_USER@$OVH_HOST" "sudo bash -s" <<'REMOTE'
          set -eu
          PUBLIC_IP="51.89.224.80"
          echo "=== CURRENT CONTAINER ==="
          docker inspect srs --format 'Image={{.Config.Image}} Env={{json .Config.Env}} Ports={{json .HostConfig.PortBindings}}'
          echo "=== RECREATE WITH PUBLIC CANDIDATE ==="
          IMAGE=$(docker inspect srs --format '{{.Config.Image}}')
          docker rm -f srs
          docker run -d --name srs --restart unless-stopped             -e CANDIDATE="$PUBLIC_IP"             -p 1935:1935 -p 1985:1985 -p 8080:8080 -p 8000:8000/udp             "$IMAGE" ./objs/srs -c conf/rtc.conf
          sleep 4
          echo "=== VERIFY ==="
          docker ps --filter name=srs
          docker inspect srs --format 'Env={{json .Config.Env}} Ports={{json .HostConfig.PortBindings}}'
          curl -fsS http://127.0.0.1:1985/api/v1/versions
          echo
          ss -lunp | grep ':8000' || true
          docker logs --tail 60 srs 2>&1
          REMOTE

# verify-live-after-public-candidate
